name: databento-nq
# doc 256: one-off download of true NQ order flow (aggressor side) within DK's Databento free credit. Data only, no orders.
on:
  workflow_dispatch:
    inputs:
      budget: { description: "max $ to spend (free credit is $125)", default: "90" }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q databento pandas
      - run: python src/databento_nq.py
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          DB_BUDGET: ${{ github.event.inputs.budget }}
      - name: Commit
        if: always()
        run: |
          git config user.name "databento-nq"; git config user.email "databento@users.noreply.github.com"
          git add -f data_nq_cache/nq_true_delta_5m.csv.gz 2>/dev/null; git commit -m "NQ true-delta 5m bars (Databento)" || true
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep $((i*7)); done
