name: Long-history data download (doc 222 — data only, no trading)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance pandas xlrd openpyxl
      - run: python src/get_history.py
      - name: Commit data
        run: |
          git config user.name "history-data"; git config user.email "history-data@users.noreply.github.com"
          git add -f data_hist; git commit -m "long-history data $(date -u +%Y-%m-%dT%H:%M)" || true
          git push || (git fetch origin main && git rebase -X theirs origin/main && git push)
