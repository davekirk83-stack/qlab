name: alpaca-bars
# doc 274: data only — 15-min bars for US stocks / commodity ETFs from DK's free Alpaca account (no orders, no trading API calls).
on:
  workflow_dispatch:
    inputs:
      syms: { description: "comma-separated symbols (blank = default list)", default: "" }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas
      - run: python src/alpaca_bars.py
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SYMS: ${{ github.event.inputs.syms }}
      - name: Commit
        if: always()
        run: |
          git config user.name "alpaca-bars"; git config user.email "alpaca@users.noreply.github.com"
          git add -f data_alpaca/*.csv.gz 2>/dev/null; git commit -m "Alpaca 15-min bars (stocks / commodity ETFs)" || true
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep $((i*7)); done
