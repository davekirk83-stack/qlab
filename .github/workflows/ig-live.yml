name: IG LIVE runner (doc 185/194 — £500 book, Ignition to the US evening + spike engine NQ/US500; ladders off, minimum stakes)
# CAP-021 as amended 4 Nov 2026 (DK "Yes"). DK owns and controls this: it does nothing unless the repo VARIABLE IG_LIVE_ENABLED is "true"
# (Settings -> Secrets and variables -> Actions -> Variables). Live credentials are the secrets IG_USERNAME_LIVE / IG_PASSWORD_LIVE /
# IG_API_KEY_LIVE, set by DK. Same code as the demo; state and logs in runs/ig_live. Claude never dispatches this workflow.
on:
  workflow_dispatch:
    inputs:
      minutes: { description: "how long to run", default: "30" }
      dry: { description: "true = no orders; --markets = read-only market check; false = trade (needs IG_LIVE_ENABLED)", default: "--markets" }
      chain: { description: "1 = started by the previous live session (the hand-over chain); leave 0 for manual runs", default: "0" }
  schedule:
    # doc 194: London-morning crons removed 9 Nov evening with the ladders (nothing live trades before the US open). Was: London morning to the US close, three back-to-back jobs (each under the 350-min limit):
    #   07:55 London -> 08:35 NY (FTSE ladder); 08:40 NY -> 13:20 NY (Ignition first half, ladders through the US lunch); 13:25 NY -> 17:00 NY.
    # Summer and winter variants of each; the wrong DST one exits. Session END times are computed in New York time below.
    - cron: "40 12 * * 1-5"
    - cron: "10 13 * * 1-5"
    - cron: "40 13 * * 1-5"
    - cron: "10 14 * * 1-5"
    # 17 Nov: on 16 Nov GitHub started the US job at 15:41 London - every cron above ran 1.5-3h late, so Williams missed the US open.
    # More fallback starts (the in-progress check stops doubles); the first one that actually runs takes the session.
    - cron: "25 14 * * 1-5"
    - cron: "35 14 * * 1-5"
    - cron: "50 14 * * 1-5"
    - cron: "25 17 * * 1-5"
    - cron: "55 17 * * 1-5"
    - cron: "25 18 * * 1-5"
    - cron: "55 18 * * 1-5"
    # 16 Nov (doc 238): LONDON MORNING back for Williams on USD/JPY (08:00 London open) — only does anything when DK's IG_WVB_LIVE_ENABLED is true;
    # both DST variants, the wrong one exits. OVERNIGHT AD stack (doc 227/235) — only when DK's IG_ADSTACK_LIVE_ENABLED is true.
    - cron: "55 7 * * 1-5"
    - cron: "55 6 * * 1-5"
    - cron: "10 22 * * 0-4"
    - cron: "10 21 * * 0-4"
    - cron: "5 3 * * 1-5"
    - cron: "5 0 * * 1-5"     # 17 Nov: the evening job runs to midnight UTC, so the 22:10 overnight start exits as a double - this covers 00:05-03:00
permissions:
  contents: write
  actions: write   # 17 Nov: each live session starts the next one itself (hand-over chain) instead of waiting for GitHub's late cron
concurrency:
  group: ig-live   # ONE runner at a time, whatever started it (26 Oct: a late 13:10 cron overlapped a manual run and doubled the orders)
  cancel-in-progress: false
jobs:
  run:
    # scheduled sessions trade only when DK has set IG_LIVE_ENABLED=true; a manual run with dry not 'false' (dry / --markets) is always allowed
    if: vars.IG_LIVE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - run: echo "T0=$(date -u +%s)" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q trading-ig pandas numpy
      - name: Run (LIVE account; secrets never printed)
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME_LIVE || secrets.IG_USERNAME }}   # DK 4 Nov: live login is in IG_USERNAME / IG_PASSWORD
          IG_PASSWORD: ${{ secrets.IG_PASSWORD_LIVE || secrets.IG_PASSWORD }}
          IG_API_KEY: ${{ secrets.IG_API_KEY_LIVE }}
          IG_MODE: live
          GH_TOKEN: ${{ github.token }}     # 17 Nov: the session clock starts the daily books on time
          IG_LIVE_CONFIRMED: CAP021-AMENDED-2026-11-09-IG-WIDER-500   # doc 194: widened scope (DK 9 Nov 17:23)
          IG_MIN_ONLY: "0"                  # DK 11 Nov 09:18 "Now": stakes from risk (3% per trade under a £1,000 pot, config/live_pot.json), not IG's minimum
          IG_NEWS: "0"
          IG_ENTRY_CLOSE_NY: "1110"         # doc 194 (DK 9 Nov 19:07): Ignition entries to 18:30 New York (evening 16-19 NY: n46/yr, +11 to +14 pts/trade after wider spreads, both halves positive); session ends 19:00 NY
          IG_RANGE_SIZE: "0.14"   # doc 137: ladder sized as for a £1,000 account (20% of equity as margin at 5% = £4,000 notional on US Tech 100)
          IG_RANGE_INSTR: "NQ,US500,USDJPY,GOLD"   # bars for the spike + Williams engines (ladders stay OFF, IG_RANGE_ORDERS 0); USD/JPY added 16 Nov for Williams
          IG_RANGE_ORDERS: "0"              # doc 194 (DK 9 Nov 18:55 "If they don't earn money then take them off"): ladders OFF on live — honest pricing shows no edge
          IG_WVB: ${{ vars.IG_WVB_LIVE_ENABLED == 'true' && 'NQ,US500,USDJPY,GOLD' || '' }}   # doc 228/235: Williams breakout — DK's switch IG_WVB_LIVE_ENABLED; USD/JPY via the London-morning job (16 Nov)
          IG_AD_STACK: ${{ vars.IG_ADSTACK_LIVE_ENABLED == 'true' && '1' || '0' }}       # doc 235/238: AD stack (regime + coil, Tue/Wed off) — DK's switch IG_ADSTACK_LIVE_ENABLED
          IG_IGN_HOURS: ${{ vars.IG_ADSTACK_LIVE_ENABLED == 'true' && 'all' || 'us' }}
          IG_AD_CONV: ${{ vars.IG_ADSTACK_LIVE_ENABLED == 'true' && '1' || '0' }}   # doc 256 (DK 22 Nov 10:32 "Yes add it"): AuclairsDad raw-conviction path, live with his stack
          ADSTACK_ON: ${{ vars.IG_ADSTACK_LIVE_ENABLED == 'true' && '1' || '0' }}
          WVB_ON: ${{ vars.IG_WVB_LIVE_ENABLED == 'true' && '1' || '0' }}
          IG_WVB_LIVE: "1"
          IG_SPIKE: "NQ,US500"              # doc 194: spike continuation engine (doc 191) on live, minimum stakes, 2% risk cap
          IG_SHOCK_PAUSE: "NQ,FTSE"         # doc 190 S1 / 191: no ladder rungs against an abnormal 15-min bar for 2h (as on the demo)
          IG_GOV_SPLIT: "1"                 # doc 189: each engine/market its own 8 trades a day; Ignition cap in points, ladders in £
          IG_BOOK_START_EQ: "500"   # doc 171: the demo trades as the £500 combined book (book 13); stakes come from book equity (src/ig_book.py)
          IG_SIZE: "0.01"         # doc 137: Ignition at ~2% risk of a £1,000 account (stop 45-90 pts)   # 26 Oct: full £1/pt ladders on 3 indices, both sides as working orders, hit INSUFFICIENT_FUNDS on the demo
        run: |
          ARGS="${{ github.event.inputs.minutes }}"; DRY="${{ github.event.inputs.dry }}"
          OTHERS=$(GH_TOKEN=${{ github.token }} gh run list -R ${{ github.repository }} --workflow ig-live.yml --status in_progress --json databaseId -q '[.[] | select(.databaseId != ${{ github.run_id }})] | length' 2>/dev/null || echo 0)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${OTHERS:-0}" -gt 0 ]; then echo "another live session is already running — this one exits"; exit 0; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "55 7 * * 1-5" ] || [ "${{ github.event.schedule }}" = "55 6 * * 1-5" ]; then
              LH=$(TZ=Europe/London date +%H); case "$LH" in 07|08) ;; *) echo "not 7-8am London (the other DST cron) — exit"; exit 0;; esac
            fi
            if [ "${{ github.event.schedule }}" = "15 12 * * 1-5" ] || [ "${{ github.event.schedule }}" = "15 13 * * 1-5" ]; then
              TODAY=$(TZ=America/New_York date +%F); NYH=$(TZ=America/New_York date +%H)
              python3 -c "import json,sys; sys.exit(0 if '$TODAY' in json.load(open('runs/event_blackouts.json')).get('cpi', []) else 1)" || { echo "not a CPI morning — exit"; exit 0; }
              case "$NYH" in 08|09) ;; *) echo "CPI morning but not 8-9am New York (the other DST cron) — exit"; exit 0;; esac
            fi
            NIGHT=""
            case "${{ github.event.schedule }}" in
              "55 7 * * 1-5"|"55 6 * * 1-5") [ "$WVB_ON" = "1" ] || [ "$ADSTACK_ON" = "1" ] || { echo "London morning: neither Williams nor the AD stack is switched on — exit"; exit 0; };;
              "10 22 * * 0-4"|"10 21 * * 0-4") [ "$ADSTACK_ON" = "1" ] || { echo "overnight: IG_ADSTACK_LIVE_ENABLED not true — exit"; exit 0; }
                NYH=$(TZ=America/New_York date +%H); case "$NYH" in 17) ;; *) echo "not 5pm New York (the other DST cron) — exit"; exit 0;; esac
                NIGHT=1; ARGS=$(( ($(date -u -d "tomorrow 03:00" +%s) - $(date -u +%s)) / 60 )); [ "$ARGS" -gt 340 ] && ARGS=$(( ($(date -u -d "today 03:00" +%s) - $(date -u +%s)) / 60 ));;
              "5 0 * * 1-5") [ "$ADSTACK_ON" = "1" ] || { echo "overnight: IG_ADSTACK_LIVE_ENABLED not true — exit"; exit 0; }
                NIGHT=1; ARGS=$(( ($(date -u -d "today 03:00" +%s) - $(date -u +%s)) / 60 ));;
              "5 3 * * 1-5") [ "$ADSTACK_ON" = "1" ] || { echo "overnight: IG_ADSTACK_LIVE_ENABLED not true — exit"; exit 0; }
                NIGHT=1; ARGS=$(( ($(TZ=Europe/London date -d "today 07:50" +%s) - $(date -u +%s)) / 60 ));;
            esac
            if [ -n "$NIGHT" ]; then
              echo "LIVE overnight session: AD stack (regime + coil + Ignition, Tue/Wed off), $ARGS minutes"
              [ "$ARGS" -lt 10 ] && { echo "night window over — exit"; exit 0; }
              mkdir -p runs/ig_live; bash src/session_clock.sh ${{ github.repository }} & CLK=$!
              QLAB_ROOT=$PWD python src/ig_runner.py $ARGS 2>&1 | tee runs/ig_live/last_run.log; kill $CLK 2>/dev/null; exit 0
            fi
            # END in NEW YORK time (DST-proof): first half to 12:05 NY (v1.1 takes no entries 12:00-14:59 NY), second half to 17:00 NY
            # doc 194: London morning to 08:35 NY, first half to 13:20 NY (ladders run through the lunch; Ignition skips 12-15 NY itself), second half to 17:00 NY
            case "${{ github.event.schedule }}" in "55 7 * * 1-5"|"55 6 * * 1-5") END="08:35";; "40 12 * * 1-5"|"10 13 * * 1-5"|"40 13 * * 1-5"|"10 14 * * 1-5"|"25 14 * * 1-5"|"35 14 * * 1-5"|"50 14 * * 1-5") END="13:20";; *) END="19:00";; esac
            ARGS=$(( ($(TZ=America/New_York date -d "today $END" +%s) - $(date -u +%s)) / 60 ))
            if [ "$ARGS" -lt 10 ]; then echo "session window $END already over (cron ran late) — nothing to do"; exit 0; fi
            [ "$ARGS" -gt 340 ] && ARGS=340   # GitHub's 6-hour job limit
            DRY=""
          elif [ -f runs/ig_live/trigger.txt ] && [ -z "$ARGS" ]; then ARGS=$(cut -d' ' -f1 runs/ig_live/trigger.txt); DRY=$(cut -s -d' ' -f2 runs/ig_live/trigger.txt); fi
          [ "$DRY" = "true" ] || [ "$DRY" = "--dry" ] && DRYF="--dry" || DRYF=""
          [ "$DRY" = "--order-test" ] && DRYF="--order-test"; [ "$DRY" = "--tx" ] && DRYF="--tx"; [ "$DRY" = "--markets" ] && DRYF="--markets"
          mkdir -p runs/ig_live
          CLK=""; [ -z "$DRYF" ] && { bash src/session_clock.sh ${{ github.repository }} & CLK=$!; }   # 17 Nov: the live session keeps the daily books' clock
          QLAB_ROOT=$PWD python src/ig_runner.py ${ARGS:-60} $DRYF 2>&1 | tee runs/ig_live/last_run.log
          [ -n "$CLK" ] && kill $CLK 2>/dev/null; true
      - name: Commit results
        if: always()
        run: |
          git config user.name "ig-runner"; git config user.email "ig-runner@users.noreply.github.com"; mkdir -p runs/ig_live
          git add -f runs/ig_live; git commit -m "ig LIVE run $(date -u +%Y-%m-%dT%H:%M)" || true
          git push || (git fetch origin main && git rebase -X theirs origin/main && git push)
      - name: Hand over to the next session (17 Nov - no gaps, no waiting for GitHub's cron)
        # The first scheduled start of the week (Sunday 22:10/21:10 UTC overnight, or any weekday cron) begins the chain; after that each
        # session starts the next the moment it ends, so the book is watched round the clock Mon-Fri. Stops for the weekend at Fri 21:00 UTC.
        # Only real sessions chain (schedule, or a run this chain started) and only if the session ran >= 30 min (a crash can't loop).
        # Started by DK's own workflow with its own token - Claude never dispatches it. DK's IG_LIVE_ENABLED still gates every run.
        if: always() && vars.IG_LIVE_ENABLED == 'true' && (github.event_name == 'schedule' || github.event.inputs.chain != '0' && github.event.inputs.chain != '')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          RAN=$(( ($(date -u +%s) - T0) / 60 )); echo "this session ran $RAN min"
          # 17 Nov: a cron that fires hours late exits at its gate in seconds - it must still start the chain. Only chained runs need the 30-min
          # guard (that is what stops a crashing session looping); a scheduled run can't loop.
          # 17 Nov 06:48: a session that crashes must not break the chain either. A short chained run retries after 5 min, up to 6 times in a
          # row (chain counts the short runs); any run of 30+ min resets the count. Only 6 straight failures stop it (a real fault, not a blip).
          C="${{ github.event.inputs.chain }}"; C=${C:-0}; NEXT=1
          if [ "${{ github.event_name }}" != "schedule" ] && [ "$RAN" -lt 30 ]; then
            NEXT=$(( C + 1 )); [ "$NEXT" -le 7 ] || { echo "6 short sessions in a row - chain stops (a real fault)"; exit 1; }
            echo "short chained session ($RAN min) - retry $((NEXT-1)) of 6 in 5 min"; sleep 300
          fi
          N=$(gh run list -R ${{ github.repository }} --workflow ig-live.yml --json databaseId,status -q '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != "completed")] | length' 2>/dev/null || echo 1)
          [ "$N" -eq 0 ] || { echo "another live session is running or queued - no hand-over needed"; exit 0; }
          DOW=$(date -u +%u); H=$(date -u +%H)
          if [ "$DOW" = 6 ] || { [ "$DOW" = 5 ] && [ "$H" -ge 21 ]; } || { [ "$DOW" = 7 ] && [ "$H" -lt 21 ]; }; then echo "weekend - chain stops"; exit 0; fi
          END=$(date -u -d "$( [ "$DOW" = 5 ] && echo today || echo "next friday" ) 21:00" +%s)
          MIN=$(( (END - $(date -u +%s)) / 60 )); [ "$MIN" -gt 340 ] && MIN=340
          [ "$MIN" -ge 10 ] || { echo "under 10 min to the weekend close - chain stops"; exit 0; }
          gh workflow run ig-live.yml -R ${{ github.repository }} -f minutes=$MIN -f dry=false -f chain=$NEXT && echo "next session started: $MIN min (chain $NEXT)"
