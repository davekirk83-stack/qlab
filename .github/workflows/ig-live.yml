name: IG LIVE runner (doc 185/194 — £500 book, Ignition + spike engine NQ/US500; ladders off, minimum stakes)
# CAP-021 as amended 4 Nov 2026 (DK "Yes"). DK owns and controls this: it does nothing unless the repo VARIABLE IG_LIVE_ENABLED is "true"
# (Settings -> Secrets and variables -> Actions -> Variables). Live credentials are the secrets IG_USERNAME_LIVE / IG_PASSWORD_LIVE /
# IG_API_KEY_LIVE, set by DK. Same code as the demo; state and logs in runs/ig_live. Claude never dispatches this workflow.
on:
  workflow_dispatch:
    inputs:
      minutes: { description: "how long to run", default: "30" }
      dry: { description: "true = no orders; --markets = read-only market check; false = trade (needs IG_LIVE_ENABLED)", default: "--markets" }
  schedule:
    # doc 194: London-morning crons removed 9 Nov evening with the ladders (nothing live trades before the US open). Was: London morning to the US close, three back-to-back jobs (each under the 350-min limit):
    #   07:55 London -> 08:35 NY (FTSE ladder); 08:40 NY -> 13:20 NY (Ignition first half, ladders through the US lunch); 13:25 NY -> 17:00 NY.
    # Summer and winter variants of each; the wrong DST one exits. Session END times are computed in New York time below.
    - cron: "40 12 * * 1-5"
    - cron: "10 13 * * 1-5"
    - cron: "40 13 * * 1-5"
    - cron: "10 14 * * 1-5"
    - cron: "25 17 * * 1-5"
    - cron: "55 17 * * 1-5"
    - cron: "25 18 * * 1-5"
    - cron: "55 18 * * 1-5"
permissions:
  contents: write
  actions: read
concurrency:
  group: ig-live   # ONE runner at a time, whatever started it (26 Oct: a late 13:10 cron overlapped a manual run and doubled the orders)
  cancel-in-progress: false
jobs:
  run:
    # scheduled sessions trade only when DK has set IG_LIVE_ENABLED=true; a manual run with dry not 'false' (dry / --markets) is always allowed
    if: vars.IG_LIVE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q trading-ig pandas numpy
      - name: Run (LIVE account; secrets never printed)
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME_LIVE || secrets.IG_USERNAME }}   # DK 4 Nov: live login is in IG_USERNAME / IG_PASSWORD
          IG_PASSWORD: ${{ secrets.IG_PASSWORD_LIVE || secrets.IG_PASSWORD }}
          IG_API_KEY: ${{ secrets.IG_API_KEY_LIVE }}
          IG_MODE: live
          IG_LIVE_CONFIRMED: CAP021-AMENDED-2026-11-09-IG-WIDER-500   # doc 194: widened scope (DK 9 Nov 17:23)
          IG_MIN_ONLY: "1"
          IG_NEWS: "0"
          IG_RANGE_SIZE: "0.14"   # doc 137: ladder sized as for a £1,000 account (20% of equity as margin at 5% = £4,000 notional on US Tech 100)
          IG_RANGE_INSTR: "NQ,US500"        # bars for the spike engine only (FTSE dropped with the ladders)
          IG_RANGE_ORDERS: "0"              # doc 194 (DK 9 Nov 18:55 "If they don't earn money then take them off"): ladders OFF on live — honest pricing shows no edge
          IG_SPIKE: "NQ,US500"              # doc 194: spike continuation engine (doc 191) on live, minimum stakes, 2% risk cap
          IG_SHOCK_PAUSE: "NQ,FTSE"         # doc 190 S1 / 191: no ladder rungs against an abnormal 15-min bar for 2h (as on the demo)
          IG_GOV_SPLIT: "1"                 # doc 189: each engine/market its own 8 trades a day; Ignition cap in points, ladders in £
          IG_BOOK_START_EQ: "500"   # doc 171: the demo trades as the £500 combined book (book 13); stakes come from book equity (src/ig_book.py)
          IG_SIZE: "0.01"         # doc 137: Ignition at ~2% risk of a £1,000 account (stop 45-90 pts)   # 26 Oct: full £1/pt ladders on 3 indices, both sides as working orders, hit INSUFFICIENT_FUNDS on the demo
        run: |
          ARGS="${{ github.event.inputs.minutes }}"; DRY="${{ github.event.inputs.dry }}"
          OTHERS=$(GH_TOKEN=${{ github.token }} gh run list -R ${{ github.repository }} --workflow ig-live.yml --status in_progress --json databaseId -q '[.[] | select(.databaseId != ${{ github.run_id }})] | length' 2>/dev/null || echo 0)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${OTHERS:-0}" -gt 0 ]; then echo "another live session is already running — this one exits"; exit 0; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "55 7 * * 1-5" ] || [ "${{ github.event.schedule }}" = "55 6 * * 1-5" ]; then
              LH=$(TZ=Europe/London date +%H); case "$LH" in 07|08) ;; *) echo "not 7-8am London (the other DST cron) — exit"; exit 0;; esac
            fi
            if [ "${{ github.event.schedule }}" = "15 12 * * 1-5" ] || [ "${{ github.event.schedule }}" = "15 13 * * 1-5" ]; then
              TODAY=$(TZ=America/New_York date +%F); NYH=$(TZ=America/New_York date +%H)
              python3 -c "import json,sys; sys.exit(0 if '$TODAY' in json.load(open('runs/event_blackouts.json')).get('cpi', []) else 1)" || { echo "not a CPI morning — exit"; exit 0; }
              case "$NYH" in 08|09) ;; *) echo "CPI morning but not 8-9am New York (the other DST cron) — exit"; exit 0;; esac
            fi
            # END in NEW YORK time (DST-proof): first half to 12:05 NY (v1.1 takes no entries 12:00-14:59 NY), second half to 17:00 NY
            # doc 194: London morning to 08:35 NY, first half to 13:20 NY (ladders run through the lunch; Ignition skips 12-15 NY itself), second half to 17:00 NY
            case "${{ github.event.schedule }}" in "55 7 * * 1-5"|"55 6 * * 1-5") END="08:35";; "40 12 * * 1-5"|"10 13 * * 1-5"|"40 13 * * 1-5"|"10 14 * * 1-5") END="13:20";; *) END="17:00";; esac
            ARGS=$(( ($(TZ=America/New_York date -d "today $END" +%s) - $(date -u +%s)) / 60 ))
            if [ "$ARGS" -lt 10 ]; then echo "session window $END already over (cron ran late) — nothing to do"; exit 0; fi
            DRY=""
          elif [ -f runs/ig_live/trigger.txt ] && [ -z "$ARGS" ]; then ARGS=$(cut -d' ' -f1 runs/ig_live/trigger.txt); DRY=$(cut -s -d' ' -f2 runs/ig_live/trigger.txt); fi
          [ "$DRY" = "true" ] || [ "$DRY" = "--dry" ] && DRYF="--dry" || DRYF=""
          [ "$DRY" = "--order-test" ] && DRYF="--order-test"; [ "$DRY" = "--tx" ] && DRYF="--tx"; [ "$DRY" = "--markets" ] && DRYF="--markets"
          mkdir -p runs/ig_live
          QLAB_ROOT=$PWD python src/ig_runner.py ${ARGS:-60} $DRYF 2>&1 | tee runs/ig_live/last_run.log
      - name: Commit results
        if: always()
        run: |
          git config user.name "ig-runner"; git config user.email "ig-runner@users.noreply.github.com"; mkdir -p runs/ig_live
          git add -f runs/ig_live; git commit -m "ig LIVE run $(date -u +%Y-%m-%dT%H:%M)" || true
          git push || (git fetch origin main && git rebase -X theirs origin/main && git push)
