name: gex-recorder
# doc 260: daily dealer-gamma levels (SPX, NDX, SPY, QQQ) from Cboe's free delayed chains; data only, no orders.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 12 * * 1-5"   # before the US open (previous day's OI)
    - cron: "17 21 * * 1-5"   # after the close
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas numpy yfinance
      - run: python src/gex_recorder.py
      - name: Commit
        if: always()
        run: |
          git config user.name "gex-recorder"; git config user.email "gex@users.noreply.github.com"
          git add -f runs/gex; git commit -m "gex $(date -u +%Y-%m-%dT%H:%M)" || true
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep $((i*7)); done
