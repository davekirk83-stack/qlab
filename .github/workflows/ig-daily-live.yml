name: IG daily books LIVE (doc 210 — core books RSI4, TPS, TOM, Santa on DK's £500 IG book; DK's switch IG_DAILY_LIVE_ENABLED)
on:
  workflow_dispatch:
    inputs:
      job: { description: "eu_open / us_open / eu_close / us_close", default: "us_close" }
      dry: { description: "dry run (no orders)", default: "true" }
  schedule:
    # GitHub cron is UTC-only and often fires 20-40 min late, so each job starts early and waits for its target time.
    # Both DST variants are listed; the script's "already ran today" check makes the second a no-op.
    - cron: "45 6 * * 1-5"    # eu_open  (target 08:05 London)
    - cron: "45 7 * * 1-5"
    - cron: "55 12 * * 1-5"   # us_open  (target 09:35 New York: dip books trade at the open on yesterday's final close, doc 206)
    - cron: "55 13 * * 1-5"
    - cron: "40 14 * * 1-5"   # eu_close (target 16:10 London)
    - cron: "40 15 * * 1-5"
    - cron: "50 18 * * 1-5"   # us_close (target 15:40 New York)
    - cron: "50 19 * * 1-5"
permissions:
  contents: write
concurrency:
  group: ig-daily-live
  cancel-in-progress: false
jobs:
  run:
    # Trades only when DK sets the repo variable IG_DAILY_LIVE_ENABLED=true. DK 10 Nov 07:37: "I want both books to operate on the account" —
    # runs alongside the intraday live runner; both share the one £500 book: one 5x cap on the whole account, and the -4% day stop / -15% floor
    # measured on the whole account. A manual run with dry=true is always allowed (no orders). Claude never dispatches this workflow.
    if: vars.IG_DAILY_LIVE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q trading-ig pandas numpy yfinance
      - name: Run (LIVE account; secrets never printed)
        env:
          IG_MODE: live
          IG_DAILY_LIVE_CONFIRMED: CAP021-AMENDED-2026-11-10-IG-DAILY-CORE-500
          IG_DAILY_START_EQ: "500"
          IG_USERNAME: ${{ secrets.IG_USERNAME_LIVE || secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD_LIVE || secrets.IG_PASSWORD }}
          IG_API_KEY: ${{ secrets.IG_API_KEY_LIVE }}
        run: |
          mkdir -p runs/ig_daily_live; echo "$(date -u +%FT%TZ) ${{ github.event_name }} IG_DAILY_LIVE_ENABLED=${{ vars.IG_DAILY_LIVE_ENABLED }}" >> runs/ig_daily_live/switch.log   # lets Claude confirm DK's switch from the repo
          JOB="${{ github.event.inputs.job }}"; DRY="${{ github.event.inputs.dry }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DRY="false"
            case "${{ github.event.schedule }}" in
              "45 6 * * 1-5"|"45 7 * * 1-5")   JOB=eu_open;  TZN=Europe/London;    T="08:05";;
              "55 12 * * 1-5"|"55 13 * * 1-5") JOB=us_open;  TZN=America/New_York; T="09:35";;
              "40 14 * * 1-5"|"40 15 * * 1-5") JOB=eu_close; TZN=Europe/London;    T="16:10";;
              *)                               JOB=us_close; TZN=America/New_York; T="15:40";;
            esac
            WAIT=$(( $(TZ=$TZN date -d "today $T" +%s) - $(date -u +%s) ))
            if [ "$WAIT" -gt 3600 ]; then echo "other DST variant (target $T $TZN is $WAIT s away) — exit"; exit 0; fi
            if [ "$WAIT" -lt -1500 ]; then echo "cron fired too late for $T $TZN — exit"; exit 0; fi
            if [ "$WAIT" -gt 0 ]; then echo "waiting $WAIT s for $T $TZN"; sleep $WAIT; fi
          fi
          [ "$DRY" = "true" ] && DRYF="--dry" || DRYF=""
          QLAB_ROOT=$PWD python src/ig_daily_books.py "$JOB" $DRYF
      - name: Commit results
        if: always()
        run: |
          git config user.name "ig-daily-live"; git config user.email "ig-daily@users.noreply.github.com"
          git add -f runs/ig_daily_live; git commit -m "ig daily LIVE $(date -u +%Y-%m-%dT%H:%M)" || true
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs origin main && git push -q && break; echo "push retry $i"; sleep $((i*7)); done   # another workflow may push at the same moment
