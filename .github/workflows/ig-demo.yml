name: IG demo runner (book 13 rehearsal — Ignition v1.1 + Range NQ + news fade, DEMO ONLY)
on:
  workflow_dispatch:
    inputs:
      minutes: { description: "how long to run", default: "60" }
      dry: { description: "dry run (no orders)", default: "false" }
  push:
    paths: ["runs/ig_demo/trigger.txt"]
  schedule:
    - cron: "40 12 * * 1-5"   # 12:40 UTC (was 13:10; moved 27 Oct because GitHub fired it ~40 min late two days running): first half of the US session; runs to a fixed 16:05 UTC (v1.1 takes no entries 16-18 UTC) whatever the cron delay (observed ~33 min)
    - cron: "25 17 * * 1-5"   # 17:25 UTC (was 17:55, fired ~27 min late): second half 18:00-21:00; runs to a fixed 21:00 UTC and flattens at the end
    - cron: "10 13 * * 1-5"   # backup for the first half (GitHub skipped/delayed 13:10 on 26 Oct); exits at once if a session is already running
    - cron: "55 17 * * 1-5"   # backup for the second half
    # US WINTER TIME (from Mon 2 Nov 2026 to March): the same four, one hour later. GitHub cron is UTC-only, so both sets stay;
    # whichever fires second finds a session running and exits. Session END times are computed in New York time below.
    - cron: "40 13 * * 1-5"
    - cron: "25 18 * * 1-5"
    - cron: "10 14 * * 1-5"
    - cron: "55 18 * * 1-5"
    # CPI MORNINGS (doc 171, book 13 news fade): start at 8:15 New York so the runner has the pre-release bars and the 8:30 release.
    # Fires every weekday but exits at once unless today is a CPI date in runs/event_blackouts.json and it is the 8am NY hour.
    # LONDON MORNING (doc 175, from Mon 2 Nov 2026): the FTSE ladder trades 08:00-16:30 London, so the first session of the day starts at
    # 07:55 London and runs on to 12:05 New York — it covers the FTSE session AND Ignition's first half; the later first-half crons then
    # find it running and exit. Both DST variants are listed; the wrong one exits at once.
    - cron: "55 7 * * 1-5"
    - cron: "55 6 * * 1-5"
    - cron: "15 12 * * 1-5"
    - cron: "15 13 * * 1-5"
permissions:
  contents: write
  actions: read
concurrency:
  group: ig-demo   # ONE runner at a time, whatever started it (26 Oct: a late 13:10 cron overlapped a manual run and doubled the orders)
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q trading-ig pandas numpy
      - name: Run (demo account only; secrets never printed)
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME_DEMO_ACCOUNT || secrets.IIG_USERNAME_DEMO_ACCOUNT }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD_DEMO_ACCOUNT }}
          IG_API_KEY: ${{ secrets.IG_API_KEY_DEMO_ACCOUNT }}
          IG_RANGE_SIZE: "0.14"   # doc 137: ladder sized as for a £1,000 account (20% of equity as margin at 5% = £4,000 notional on US Tech 100)
          IG_RANGE_INSTR: "NQ,US500,FTSE,GBPUSD,USDJPY"   # doc 186 (DK 4 Nov): + GBP/USD and USD/JPY ladders, London hours. doc 175: the ladder on US Tech 100 + US 500 (NY hours) + FTSE 100 (London hours)    # doc 137: US Tech 100 only — best return per margin-hour; Wall Street / Germany 40 dropped
          IG_GOV_SPLIT: "1"   # doc 189: Ignition daily cap in points, ladders in £ (demo first)
          IG_BOOK_START_EQ: "500"   # doc 171: the demo trades as the £500 combined book (book 13); stakes come from book equity (src/ig_book.py)
          IG_SIZE: "0.01"         # doc 137: Ignition at ~2% risk of a £1,000 account (stop 45-90 pts)   # 26 Oct: full £1/pt ladders on 3 indices, both sides as working orders, hit INSUFFICIENT_FUNDS on the demo
        run: |
          ARGS="${{ github.event.inputs.minutes }}"; DRY="${{ github.event.inputs.dry }}"
          OTHERS=$(GH_TOKEN=${{ github.token }} gh run list -R ${{ github.repository }} --workflow ig-demo.yml --status in_progress --json databaseId -q '[.[] | select(.databaseId != ${{ github.run_id }})] | length' 2>/dev/null || echo 0)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${OTHERS:-0}" -gt 0 ]; then echo "another demo session is already running — this one exits"; exit 0; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "55 7 * * 1-5" ] || [ "${{ github.event.schedule }}" = "55 6 * * 1-5" ]; then
              LH=$(TZ=Europe/London date +%H); case "$LH" in 07|08) ;; *) echo "not 7-8am London (the other DST cron) — exit"; exit 0;; esac
            fi
            if [ "${{ github.event.schedule }}" = "15 12 * * 1-5" ] || [ "${{ github.event.schedule }}" = "15 13 * * 1-5" ]; then
              TODAY=$(TZ=America/New_York date +%F); NYH=$(TZ=America/New_York date +%H)
              python3 -c "import json,sys; sys.exit(0 if '$TODAY' in json.load(open('runs/event_blackouts.json')).get('cpi', []) else 1)" || { echo "not a CPI morning — exit"; exit 0; }
              case "$NYH" in 08|09) ;; *) echo "CPI morning but not 8-9am New York (the other DST cron) — exit"; exit 0;; esac
            fi
            # END in NEW YORK time (DST-proof): first half to 12:05 NY (v1.1 takes no entries 12:00-14:59 NY), second half to 17:00 NY
            case "${{ github.event.schedule }}" in "55 7 * * 1-5"|"55 6 * * 1-5"|"15 12 * * 1-5"|"15 13 * * 1-5") END="12:05";; "40 12 * * 1-5"|"10 13 * * 1-5"|"40 13 * * 1-5"|"10 14 * * 1-5") END="12:05";; *) END="17:00";; esac
            ARGS=$(( ($(TZ=America/New_York date -d "today $END" +%s) - $(date -u +%s)) / 60 ))
            if [ "$ARGS" -lt 10 ]; then echo "session window $END already over (cron ran late) — nothing to do"; exit 0; fi
            DRY=""
          elif [ -f runs/ig_demo/trigger.txt ] && [ -z "$ARGS" ]; then ARGS=$(cut -d' ' -f1 runs/ig_demo/trigger.txt); DRY=$(cut -s -d' ' -f2 runs/ig_demo/trigger.txt); fi
          [ "$DRY" = "true" ] || [ "$DRY" = "--dry" ] && DRYF="--dry" || DRYF=""
          [ "$DRY" = "--order-test" ] && DRYF="--order-test"; [ "$DRY" = "--tx" ] && DRYF="--tx"; [ "$DRY" = "--markets" ] && DRYF="--markets"
          QLAB_ROOT=$PWD python src/ig_runner.py ${ARGS:-60} $DRYF 2>&1 | tee runs/ig_demo/last_run.log
      - name: Commit results
        if: always()
        run: |
          git config user.name "ig-runner"; git config user.email "ig-runner@users.noreply.github.com"
          git add -f runs/ig_demo; git commit -m "ig demo run $(date -u +%Y-%m-%dT%H:%M)" || true
          git push || (git fetch origin main && git rebase -X theirs origin/main && git push)
