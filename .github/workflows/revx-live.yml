name: Revolut X LIVE runner (doc 194 — £500 Range long book, spot, long only)
# CAP-021 as amended 5 Nov 2026 (DK). DK owns and controls this. Keys are DK's secrets REVX_API_KEY / REVX_PRIVATE_KEY (never printed).
# mode=check : one read-only signed call (balances) — proves the keys work, no orders.
# mode=dry   : runs the book on live prices and logs the orders it WOULD place (no orders).
# mode=live  : trades — only if DK has set the repo VARIABLE REVX_LIVE_ENABLED to "true". Claude never dispatches mode=live.
on:
  workflow_dispatch:
    inputs:
      mode: { description: "check / dry / live", default: "check" }
  # schedule: none. Doc 194 (9 Nov): with honest resting orders the Range long book loses (-29% over 12 months); not to be funded.
permissions:
  contents: write
concurrency:
  group: revx-live
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'schedule' || github.event.inputs.mode != 'live' || vars.REVX_LIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q cryptography pandas numpy
      - name: Run (secrets never printed)
        env:
          REVX_API_KEY: ${{ secrets.REVX_API_KEY }}
          REVX_PRIVATE_KEY: ${{ secrets.REVX_PRIVATE_KEY }}
          QLAB_ROOT: ${{ github.workspace }}
        run: |
          mkdir -p runs/revx_live
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then [ "${{ vars.REVX_LIVE_ENABLED }}" = "true" ] && MODE=live || MODE=dry; fi
          if [ "$MODE" = "check" ]; then python src/revx_client.py check 2>&1 | tee runs/revx_live/last_check.log; exit ${PIPESTATUS[0]}; fi
          D=runs/revx_$MODE; mkdir -p $D
          python src/revx_live.py $MODE 2>&1 | tee -a $D/log.txt; exit ${PIPESTATUS[0]}
      - name: Commit results
        if: always()
        run: |
          git config user.name "revx-runner"; git config user.email "revx-runner@users.noreply.github.com"
          mkdir -p runs/revx_live runs/revx_dry; touch runs/revx_dry/.keep; git add -f runs/revx_live runs/revx_dry 2>/dev/null; git add -f data_rx_cache 2>/dev/null; git commit -m "revx ${{ github.event.inputs.mode }} $(date -u +%Y-%m-%dT%H:%M)" || true
          git push || (git fetch origin main && git rebase -X theirs origin/main && git push)
