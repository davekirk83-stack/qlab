name: IG demo login test
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/ig-login-test.yml", "src/ig_login_test.py"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - name: Login to IG DEMO and record result (no secrets printed)
        env:
          IG_USERNAME: ${{ secrets.IIG_USERNAME_DEMO_ACCOUNT }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD_DEMO_ACCOUNT }}
          IG_API_KEY: ${{ secrets.IG_API_KEY_DMEO }}
        run: python src/ig_login_test.py
      - name: Commit result
        run: |
          git config user.name "ig-runner"; git config user.email "ig-runner@users.noreply.github.com"
          git add runs/ig_login_test.txt; git commit -m "IG demo login test result" || true; git push
